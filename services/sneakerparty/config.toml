[general]
domain = "sneaker.party"
port = "3000"
email = "noreply@sneaker.party"
site_name = "Sneaker Party"
is_federated = true
delete_after_days = 0
show_kofi = false
show_public_event_list = false
mail_service = "nodemailer"
creator_email_addresses = [
  "${GATHIO_CREATOR_EMAIL_LARK}",
  "${GATHIO_CREATOR_EMAIL_RIVEN}",
  "${GATHIO_CREATOR_EMAIL_SCOOT}",
  "${GATHIO_CREATOR_EMAIL_AN}",
]
allow_comments_after_event_default = false
redirect_to_instance = "https://gath.io"

[database]
mongodb_url = "${GATHIO_MONGODB_URL}"

[nodemailer]
smtp_server = "${GATHIO_SMTP_SERVER}"
smtp_port = "${GATHIO_SMTP_PORT}"
smtp_username = "${GATHIO_SMTP_USERNAME}"
smtp_password = "${GATHIO_SMTP_PASSWORD}"
