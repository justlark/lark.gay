global
  log stdout format raw local0

defaults
  log global
  timeout connect 5s
  timeout client 30s
  timeout server 30s

frontend website
  bind :8443
  mode tcp
  default_backend cloudflare

backend cloudflare
  mode tcp
  server cloudflare lark.gay:443

frontend gemini
  bind :1965
  mode tcp
  default_backend gemini_backend

backend gemini_backend
  mode tcp
  server gemini lark-gemini-capsule.internal:1965
